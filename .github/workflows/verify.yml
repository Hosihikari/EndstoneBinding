name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: IR contract
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/BindingIr
          path: BindingIr

      - name: Generator
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/BindingGenerator
          path: BindingGenerator

      - name: ABI contract
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/BindingAbi
          path: BindingAbi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Hosihikari.Bindings.Endstone.slnx -c Release -p:AbiProjectPath=${{ github.workspace }}/BindingAbi/src/Hosihikari.Bindings.Abi/Hosihikari.Bindings.Abi.csproj

      - name: Verify generated sources
        run: python3 scripts/verify_generated.py

      - name: Validate coverage contract
        run: dotnet run --project BindingGenerator/src/Hosihikari.Bindings.Generator/Hosihikari.Bindings.Generator.csproj -c Release -- validate-coverage coverage/summary.json coverage/manifest.jsonl

  linux-shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: EndstoneBinding

      - name: Generator
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/BindingGenerator
          path: BindingGenerator

      - name: IR contract
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/BindingIr
          path: BindingIr

      - name: ABI contract
        uses: actions/checkout@v4
        with:
          repository: Hosihikari/BindingAbi
          path: BindingAbi

      - name: Endstone headers
        uses: actions/checkout@v4
        with:
          repository: EndstoneMC/endstone
          ref: v0.11.14
          path: endstone
          fetch-depth: 1

      - name: expected-lite
        uses: actions/checkout@v4
        with:
          repository: martinmoene/expected-lite
          ref: v0.9.0
          path: expected-lite
          fetch-depth: 1

      - name: nlohmann_json
        uses: actions/checkout@v4
        with:
          repository: nlohmann/json
          ref: v3.11.3
          path: nlohmann-json
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache LLVM
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: llvm.tar.xz
          key: llvm-23.1.3-linux-x64

      - name: Download LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.xz

      - name: Extract LLVM
        run: |
          mkdir -p llvm
          tar -xf llvm.tar.xz -C llvm --strip-components=1
          rm -rf llvm/share llvm/lib/clang/*/lib

      - name: Build frontend
        working-directory: EndstoneBinding
        run: ./frontend/build.sh --llvm-root "${{ github.workspace }}/llvm"

      - name: Generate Linux IR
        working-directory: EndstoneBinding
        run: |
          ./frontend/run-endstone.sh \
            --endstone-root "${{ github.workspace }}/endstone" \
            --llvm-root "${{ github.workspace }}/llvm" \
            --expected-lite-include "${{ github.workspace }}/expected-lite/include" \
            --nlohmann-include "${{ github.workspace }}/nlohmann-json/include" \
            --compat-include "${{ github.workspace }}/native/BindingShim/linux-compat.h" \
            --output artifacts/endstone-linux-ir

      - name: Upload Linux IR
        uses: actions/upload-artifact@v4
        with:
          name: endstone-linux-x64-server-ir
          path: BindingGenerator/artifacts/endstone-linux-ir
          retention-days: 3

      - name: Emit from Linux IR
        working-directory: EndstoneBinding
        run: |
          dotnet run --project src/Hosihikari.Bindings.Generator/Hosihikari.Bindings.Generator.csproj -c Release -- \
            emit artifacts/endstone-linux-ir/ir-manifest.json \
            artifacts/endstone-linux-ir \
            artifacts/emitted-linux \
            --abi-header ../BindingAbi/native/hosihikari_abi.h \
            --native-root ../endstone \
            --virtual-dispatch

      - name: Compare generated Interop
        working-directory: EndstoneBinding
        run: diff -ru ../src/Hosihikari.Bindings.Endstone.Interop/Generated artifacts/emitted-linux/interop/endstone

      - name: Build Linux shim
        run: |
          ./native/BindingShim/build.sh \
            --endstone-root endstone \
            --expected-lite-include expected-lite/include \
            --nlohmann-include nlohmann-json/include \
            --generated-include BindingGenerator/artifacts/endstone-generated/include \
            --shim-source BindingGenerator/artifacts/emitted-linux/shim/linux-x64-server/endstone/binding_table.cpp \
            --output artifacts/native/libHosihikari.Bindings.Endstone.Shim.so
